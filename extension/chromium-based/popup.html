<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <h1>YouTube Auto Quality</h1>
            <p>
                Always selects the highest quality available for each video,
                including 8K when YouTube offers it.
            </p>
            <div class="section">
                <label class="toggle-container">
                    <span class="toggle-label">Enable automatic quality</span>
                    <input type="checkbox" id="enabled" />
                    <span class="slider"></span>
                </label>
            </div>
            <div class="section">
                <label class="toggle-container">
                    <span class="toggle-label">YouTube Premium</span>
                    <input type="checkbox" id="has-premium" />
                    <span class="slider"></span>
                </label>
                <p class="setting-description">
                    Allows quality entries marked Premium, including Enhanced
                    bitrate.
                </p>
            </div>
            <div class="section">
                <label class="toggle-container">
                    <span class="toggle-label"
                        >Restart after applying quality</span
                    >
                    <input type="checkbox" id="restart-after-quality" />
                    <span class="slider"></span>
                </label>
                <p class="setting-description">
                    Seeks the video back to 0:00 once YouTube accepts the
                    quality change.
                </p>
            </div>
            <button id="close">Close</button>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
