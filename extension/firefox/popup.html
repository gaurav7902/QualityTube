<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <h1>YouTube Auto Quality</h1>
            <p>
                Always selects the highest quality available for each video,
                including 8K when YouTube offers it.
            </p>
            <div class="section">
                <label class="toggle-container">
                    <span class="toggle-label">Do you have premium?</span>
                    <input type="checkbox" id="has-premium" />
                    <span class="slider"></span>
                </label>
            </div>
            <button id="close">Close</button>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
