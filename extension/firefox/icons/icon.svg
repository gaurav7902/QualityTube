<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff1f1f"/>
            <stop offset="55%" stop-color="#e62117"/>
            <stop offset="100%" stop-color="#a30d09"/>
        </linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#ffe1e1"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
        </filter>
    </defs>

    <rect x="6" y="6" width="116" height="116" rx="26" ry="26" fill="url(#bg)"/>
    <rect x="6" y="6" width="116" height="116" rx="26" ry="26" fill="url(#sheen)"/>
    <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

    <g filter="url(#shadow)" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" text-anchor="middle">
        <text x="64" y="78" font-size="62" fill="url(#text)" stroke="#3a0010" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill">HD</text>
    </g>

    <g fill="#ffffff">
        <circle cx="42" cy="100" r="4"/>
        <circle cx="56" cy="100" r="4"/>
        <circle cx="70" cy="100" r="4"/>
        <circle cx="84" cy="100" r="4"/>
    </g>
</svg>
